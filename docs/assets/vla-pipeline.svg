<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1100" height="560" rx="12" fill="#0f172a"/>

  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">Vision-Language-Action (VLA)</text>
  <text x="550" y="58" text-anchor="middle" fill="#64748b" font-size="12">One model: see the scene, understand the instruction, output robot actions</text>

  <!-- Inputs -->
  <rect x="40" y="90" width="220" height="72" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="150" y="118" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Vision</text>
  <text x="150" y="140" text-anchor="middle" fill="#bfdbfe" font-size="11">camera frames / wrist + scene</text>

  <rect x="40" y="182" width="220" height="72" rx="10" fill="#3b1d4a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="150" y="210" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="bold">Language</text>
  <text x="150" y="232" text-anchor="middle" fill="#c4b5fd" font-size="11">put the red cup in the sink</text>

  <rect x="40" y="274" width="220" height="72" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="150" y="302" text-anchor="middle" fill="#99f6e4" font-size="13" font-weight="bold">Proprioception</text>
  <text x="150" y="324" text-anchor="middle" fill="#5eead4" font-size="11">joints, gripper, end-effector</text>

  <line x1="260" y1="126" x2="340" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="260" y1="218" x2="340" y2="218" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="260" y1="310" x2="340" y2="230" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Backbone -->
  <rect x="340" y="150" width="260" height="136" rx="14" fill="#1e1338" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="470" y="186" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">VLM backbone</text>
  <text x="470" y="210" text-anchor="middle" fill="#a78bfa" font-size="11">vision encoder + LLM</text>
  <text x="470" y="232" text-anchor="middle" fill="#94a3b8" font-size="10">fuses pixels + words + robot state</text>
  <text x="470" y="254" text-anchor="middle" fill="#64748b" font-size="10">pretrained on internet, then robot data</text>

  <line x1="600" y1="218" x2="680" y2="218" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Action head -->
  <rect x="680" y="136" width="240" height="164" rx="14" fill="#052e16" stroke="#34d399" stroke-width="1.6"/>
  <text x="800" y="168" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">Action head</text>
  <text x="800" y="194" text-anchor="middle" fill="#a7f3d0" font-size="11">discrete tokens  ·  RT-2 / OpenVLA</text>
  <text x="800" y="216" text-anchor="middle" fill="#a7f3d0" font-size="11">or flow matching  ·  À0</text>
  <text x="800" y="246" text-anchor="middle" fill="#94a3b8" font-size="10">predict an action chunk</text>
  <text x="800" y="266" text-anchor="middle" fill="#94a3b8" font-size="10">”x, ”y, ”z, rotation, gripper&</text>

  <line x1="800" y1="300" x2="800" y2="348" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Robot -->
  <rect x="680" y="352" width="240" height="72" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="800" y="380" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Robot</text>
  <text x="800" y="402" text-anchor="middle" fill="#94a3b8" font-size="11">execute chunk, then observe again</text>

  <!-- Closed loop -->
  <path d="M680,388 C520,388 420,388 420,360" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <polygon points="420,360 412,348 430,352" fill="#f59e0b"/>
  <text x="470" y="410" text-anchor="middle" fill="#fbbf24" font-size="11">closed loop · 550 Hz</text>

  <!-- Bottom comparison -->
  <rect x="40" y="380" width="580" height="140" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="330" y="408" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Why this is different from a classic stack</text>
  <text x="70" y="436" fill="#94a3b8" font-size="11">Classic:  detect ’ plan ’ inverse kinematics ’ PID   (each module is separate)</text>
  <text x="70" y="460" fill="#94a3b8" font-size="11">VLA:      one policy maps (image, instruction, state) ’ motor commands</text>
  <text x="70" y="492" fill="#64748b" font-size="11">Language is the task API. New skills = more demos + fine-tune, not a new planner.</text>
</svg>
